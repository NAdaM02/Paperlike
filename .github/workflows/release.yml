name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ./src-tauri

      - name: Install frontend
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Paperlike v__VERSION__
          releaseBody: Windows installer.
          releaseDraft: false
          prerelease: false

      - name: Publish the checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer was not produced" }
          Copy-Item -LiteralPath $exe.FullName -Destination "Paperlike-setup.exe" -Force
          $hash = (Get-FileHash -LiteralPath "Paperlike-setup.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "SHA256SUMS.txt" -Value "$hash  Paperlike-setup.exe" -Encoding ascii
          $version = (Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          gh release upload "v$version" "Paperlike-setup.exe" "SHA256SUMS.txt" --clobber
