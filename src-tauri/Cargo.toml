[package]
name = "paperlike-app"
version = "1.3.7"
description = "Paperlike — local-first note-taking"
authors = ["adama"]
edition = "2021"
default-run = "paperlike-app"

[lib]
name = "paperlike_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "paperlike"
path = "src/bin/paperlike.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
anyhow = "1"
include_dir = "0.7"
url = "2"
walkdir = "2"
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
ureq = { version = "2", features = ["json"] }
# Same version as Tauri's WebView2 backend, so the controller type matches.
webview2-com = "0.39"
printpdf = { version = "0.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
trash = "5"
clap = { version = "4", features = ["derive"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[features]
default = []
# Embeds the built pages in the exe. Without this, the window tries to open localhost.
custom-protocol = ["tauri/custom-protocol"]
